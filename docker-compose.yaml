services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: card
      POSTGRES_PASSWORD: card
      POSTGRES_DB: card
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U card -d card']
      interval: 2s
      timeout: 5s
      retries: 20
  app:
    build: .
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: production
      PORT: '3000'
      DATABASE_URL: postgresql://card:card@postgres:5432/card
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  pgdata:
